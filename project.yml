name: AIDevTools
options:
  bundleIdPrefix: org.gestrich
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "15.0"
  developmentLanguage: en
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig
settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    CLANG_ENABLE_OBJC_WEAK: YES
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: YES
    CLANG_WARN_UNGUARDED_AVAILABILITY: YES_AGGRESSIVE
    COPY_PHASE_STRIP: NO
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_C_LANGUAGE_STANDARD: gnu17
    GCC_NO_COMMON_BLOCKS: YES
    GCC_WARN_64_TO_32_BIT_CONVERSION: YES
    GCC_WARN_ABOUT_RETURN_TYPE: YES_ERROR
    GCC_WARN_UNDECLARED_SELECTOR: YES
    GCC_WARN_UNINITIALIZED_AUTOS: YES_AGGRESSIVE
    GCC_WARN_UNUSED_FUNCTION: YES
    GCC_WARN_UNUSED_VARIABLE: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SDKROOT: macosx
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
    SWIFT_VERSION: "5.0"
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_DYNAMIC_NO_PIC: NO
      GCC_OPTIMIZATION_LEVEL: 0
      GCC_PREPROCESSOR_DEFINITIONS:
        - "DEBUG=1"
        - "$(inherited)"
      MTL_ENABLE_DEBUG_INFO: INCLUDE_SOURCE
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      ENABLE_NS_ASSERTIONS: NO
      MTL_ENABLE_DEBUG_INFO: NO
      SWIFT_COMPILATION_MODE: wholemodule
packages:
  AIDevToolsKit:
    path: AIDevToolsKit
  xcode-sim-automation:
    url: https://github.com/gestrich/xcode-sim-automation
    branch: main
targets:
  AIDevTools:
    type: application
    platform: macOS
    sources:
      - path: AIDevTools
      - path: README.md
        buildPhase: resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
        CURRENT_PROJECT_VERSION: 1
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: org.gestrich.AIDevTools
        REGISTER_APP_GROUPS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: YES
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_EMIT_LOC_STRINGS: YES
    dependencies:
      - package: AIDevToolsKit
        product: AIDevToolsKitMac
      - package: AIDevToolsKit
        product: LoggingSDK
  AIDevToolsInteractiveTests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AIDevToolsInteractiveTests
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: org.gestrich.AIDevToolsInteractiveTests
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_TARGET_NAME: AIDevTools
    dependencies:
      - target: AIDevTools
      - package: xcode-sim-automation
        product: XCUITestControl
  AIDevToolsUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: AIDevToolsUITests
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        PRODUCT_BUNDLE_IDENTIFIER: org.gestrich.AIDevToolsUITests
        SWIFT_EMIT_LOC_STRINGS: NO
        TEST_TARGET_NAME: AIDevTools
    dependencies:
      - target: AIDevTools
schemes:
  AIDevTools:
    build:
      targets:
        AIDevTools: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - AIDevToolsUITests
        - AIDevToolsInteractiveTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  AIDevToolsInteractiveTests:
    build:
      targets:
        AIDevToolsInteractiveTests: [test]
        AIDevTools: [run, test]
    test:
      config: Debug
      targets:
        - AIDevToolsInteractiveTests
  AIDevToolsUITests:
    build:
      targets:
        AIDevToolsUITests: [test]
        AIDevTools: [run, test]
    test:
      config: Debug
      targets:
        - AIDevToolsUITests
